apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-service
  labels:
    app: node-service
spec:
  ingressClassName: traefik
  rules:
    - host: node-service.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-service
                port:
                  number: 8080
